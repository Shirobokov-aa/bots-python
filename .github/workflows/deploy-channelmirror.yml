name: Deploy ChannelMirror

on:
  push:
    branches: [main]
    paths:
      - "ChannelMirror/**"
      - ".github/workflows/deploy-channelmirror.yml"
  workflow_dispatch:

concurrency:
  group: deploy-channelmirror
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync ChannelMirror to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          # .env / data не в git — на сервере не затираются (rm: false)
          source: "ChannelMirror/,!ChannelMirror/.venv,!ChannelMirror/data,!ChannelMirror/tests,!ChannelMirror/STATUS.md,!ChannelMirror/README.md,!ChannelMirror/.pytest_cache,!ChannelMirror/pytest.ini,!ChannelMirror/requirements-dev.txt"
          target: /opt/bots/channelmirror
          strip_components: 1
          overwrite: true
          rm: false

      - name: Build and restart
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 15m
          script: |
            set -euo pipefail
            cd /opt/bots/channelmirror
            mkdir -p data/media
            # leftover from first sync / local junk — not needed at runtime
            rm -rf tests .pytest_cache __pycache__
            rm -f STATUS.md README.md pytest.ini requirements-dev.txt telethon_qr.png
            docker compose up -d --build --remove-orphans
            docker image prune -f
